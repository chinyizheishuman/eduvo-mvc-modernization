name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore JQuery-ECommerceAss.csproj
          dotnet restore Eduvo.Tests/Eduvo.Tests.csproj

      - name: Build
        run: |
          dotnet build JQuery-ECommerceAss.csproj --no-restore
          dotnet build Eduvo.Tests/Eduvo.Tests.csproj --no-restore

      - name: Test
        run: dotnet test Eduvo.Tests/Eduvo.Tests.csproj --no-build --no-restore
